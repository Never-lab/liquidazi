# Persistence: Postgres via DATABASE_URL (recommended), or legacy Railway Volume /data.
# On Railway without either, the app refuses to boot — otherwise each rebuild wipes data.

[build]
builder = "NIXPACKS"
# Prefer install over ci: Railway volume/cache can EBUSY rmdir on node_modules/.cache.
buildCommand = "npm install --include=dev && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
