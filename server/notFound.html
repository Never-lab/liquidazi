<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pagina non trovata — Floatdesk</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f4f3;
        --text: #141a16;
        --muted: #5c6660;
        --accent: #1a4d35;
        --surface: #fff;
        --border: #cfd5d1;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.45 system-ui, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 28rem;
        margin: 24px;
        padding: 28px 22px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      p.brand {
        margin: 0 0 8px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 13px;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 12px 16px;
        min-height: 44px;
        box-sizing: border-box;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Floatdesk</p>
      <h1>Pagina non trovata</h1>
      <p>Questo indirizzo non esiste. Torna al simulatore.</p>
      <a href="/">Vai a Floatdesk</a>
    </main>
  </body>
</html>
